[platformio]
default_envs = esp32_matrix

[env:esp32_matrix]
; Arduino-ESP32 3.3.8 / IDF 5.5.4, fixed platform release (time64).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32dev
framework = arduino
extra_scripts =
    pre:scripts/embed-portal.py
    post:scripts/flash-layout.py
board_build.partitions = partitions.csv
board_upload.maximum_size = 2818048
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@6.21.5
build_flags = -Wall -Wextra -D WEBSERVER_MAX_DATA_WAIT=20 -D WEBSERVER_MAX_POST_WAIT=20 -D WEBSERVER_MAX_SEND_WAIT=20 -D IRRIGATION_ROLE_MATRIX=1

; Bench requires explicit provisioning and verified drivers to enable outputs.
[env:esp32_sensor_bench]
extends = env:esp32_matrix
build_flags = -Wall -Wextra -D WEBSERVER_MAX_DATA_WAIT=20 -D WEBSERVER_MAX_POST_WAIT=20 -D WEBSERVER_MAX_SEND_WAIT=20 -D IRRIGATION_ROLE_MATRIX=0
lib_deps =
    ${env:esp32_matrix.lib_deps}
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0

[env:esp32_remote_node]
extends = env:esp32_sensor_bench
build_flags = -Wall -Wextra -D WEBSERVER_MAX_DATA_WAIT=20 -D WEBSERVER_MAX_POST_WAIT=20 -D WEBSERVER_MAX_SEND_WAIT=20 -D IRRIGATION_ROLE_MATRIX=0 -D IRRIGATION_REMOTE_NODE=1
