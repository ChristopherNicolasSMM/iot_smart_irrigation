name: Firmware experimental
on:
  push:
    paths: ['iot/firmware/**', 'contracts/fixtures/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['iot/firmware/**', 'contracts/fixtures/**', '.github/workflows/firmware.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install platformio==6.1.19
      - run: node --test tests/local-portal-model.test.js
      - run: node --check iot/firmware/portal/app.js
      - run: python iot/firmware/scripts/test-native.py
      - run: pio pkg install -d iot/firmware -e esp32_matrix --library bblanchon/ArduinoJson@6.21.5 --no-save
      - run: python iot/firmware/scripts/test-provision-codec.py
      - run: python iot/firmware/scripts/check-build.py
